1. display:block은 언제 쓰나요
blco 요소는 가로 한 줄을 전부 차지하는 성실이 잇다.
- 수직 평가 : 여러 요소를 위아래로 차곡차곡 쌓고 싶을때 사용합니다.
- 크지조절  : width와 height를 지정하여 박스의 크기를 명확하게 제어해얄 할떄
- 여백제어 :  width와 heigh를 지정하여 박스의 크기를 명확하게 제어해야 할때 씁니다.

2. display 속성 방식의 차이점
특징            block(h1, div등..)           inline(span, p등)           inline-block

한줄 차지       O(혼자 한줄 다 씀)            X(옆에 다른 요소 옴)         X(옆에 다른 요소 옴)  
크기지정        O(width/heigh 가능)          X(글자 크기만큼만)           O(width/height 가능)
상하 여백       O(margin-top/bottom 가능)    X(제대로 안 먹힘)            O(모두 가능)
주요 용도       레이아웃, 큰덩어리            텍스트 강조 링크             가로배치된 버튼 카드


>>  h 태그에 display:block이 설정된 이유는 제목이 페이지에서 독립적인 한줄을 차지하고, 제목으로서의 
일정한 크기와 상화 여백을 유지하기 위해서 입니다.
-->
